<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网页完整代码捕获</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 440px; margin: 0; padding: 16px;
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    font-size: 13px; color: #243447; background: #f5f8fc;
  }
  h1 { font-size: 16px; margin: 0 0 2px; color: #12395e; }
  .ver { font-size: 11px; color: #8a99ab; margin-bottom: 12px; }
  .card { background: #fff; border: 1px solid #dbe6f2; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .url { font-size: 11px; color: #63758c; word-break: break-all; line-height: 1.5; margin-bottom: 8px; }
  .status { font-size: 12px; color: #1677c8; line-height: 1.5; min-height: 18px; margin-bottom: 10px; }
  .status.err { color: #d4380d; }
  .status.ok { color: #1a7f45; }
  button {
    font-family: inherit; font-size: 13px; cursor: pointer;
    border-radius: 6px; padding: 9px 10px; border: 1px solid #cddcec;
    background: #fff; color: #243447; transition: background .15s;
  }
  button:hover:not(:disabled) { background: #edf5ff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: #1e90e7; border-color: #1e90e7; color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #1677c8; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row button { flex: 1; }
  .row:last-child { margin-bottom: 0; }
  .label { font-size: 12px; font-weight: 600; color: #3b5068; margin-bottom: 8px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .tabs button { padding: 5px 10px; font-size: 12px; }
  .tabs button.active { background: #1e90e7; border-color: #1e90e7; color: #fff; }
  .tabs .spacer { flex: 1; }
  textarea {
    width: 100%; height: 190px; resize: vertical; font-size: 11px; line-height: 1.5;
    font-family: Consolas, "Courier New", monospace; color: #2c3e50;
    border: 1px solid #dbe6f2; border-radius: 6px; padding: 8px; background: #fbfdff;
  }
  .hint { font-size: 11px; color: #7b8ba0; line-height: 1.7; margin-top: 8px; }
  .hint b { color: #1677c8; }
  .logline { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 8px; }
  .logline label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .logline .count { margin-left: auto; color: #7b8ba0; }
  .mini button { padding: 6px 8px; font-size: 12px; }
</style>
</head>
<body>
  <h1>网页完整代码捕获</h1>
  <div class="ver">v1.1 · 完整 HTML + 所有 iframe + 成交按钮诊断摘要</div>

  <div class="card">
    <div class="url" id="tabUrl">正在读取当前标签页…</div>
    <div class="status" id="status">准备捕获…</div>
    <div class="row">
      <button class="primary" id="btnSummary">① 复制诊断摘要（发这个给阿助）</button>
    </div>
    <div class="row">
      <button id="btnFull">② 复制完整源码</button>
      <button id="btnDownload">③ 下载完整源码 .txt</button>
    </div>
    <div class="hint">
      排查「成交」按钮问题时，<b>优先发 ①</b>（短、能直接定位问题）。<br>
      ② 内容可能很大，粘贴容易截断，建议用 ③ 下载后把文件拖进对话。
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button id="tabViewSummary" class="active">诊断摘要</button>
      <button id="tabViewFull">完整源码</button>
      <span class="spacer"></span>
      <button id="btnRecapture">重新捕获</button>
    </div>
    <textarea id="output" readonly placeholder="捕获结果会显示在这里，可直接全选复制"></textarea>
  </div>

  <div class="card">
    <div class="label">自动记录（每次点击后自动存一份页面片段）</div>
    <div class="logline">
      <label><input type="checkbox" id="autolog"> 开启自动记录</label>
      <span class="count" id="logCount">0 条</span>
    </div>
    <div class="row mini">
      <button id="btnLogsCopy">复制全部记录</button>
      <button id="btnLogsDownload">下载全部记录</button>
      <button id="btnLogsClear">清空</button>
    </div>
    <div class="hint">勾选后在页面上正常操作（点成交、翻页、查询等），每点一次存一条；操作完回来导出全部记录发我即可。最多保留 30 条。<br>记录只存在本机浏览器里、不上传；在敏感页面建议先关掉开关。</div>
  </div>

  <script src="capture-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
